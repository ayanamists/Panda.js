name: Take main site offline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/offline-site.yml"

concurrency:
  group: ayayaya-home-offline
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write offline site
        run: |
          mkdir -p offline-site
          cat > offline-site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex, nofollow">
            <title>ayayaya.org</title>
            <style>
              :root { color-scheme: dark light; }
              html, body { height: 100%; margin: 0; }
              body {
                display: grid;
                place-items: center;
                font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
                background: #f7f4ee;
                color: #2b2926;
              }
              @media (prefers-color-scheme: dark) {
                body { background: #161513; color: #e7e2d8; }
              }
              p { font-size: 1.05rem; letter-spacing: 0.04em; }
              small { display: block; margin-top: 0.6rem; opacity: 0.45; font-size: 0.85rem; }
            </style>
          </head>
          <body>
            <p>站点暂时下线。
              <small>This site is temporarily offline.</small>
            </p>
          </body>
          </html>
          HTML
          printf '%s\n' 'User-agent: *' 'Disallow: /' > offline-site/robots.txt
          printf '%s\n' '/*    /index.html   200' > offline-site/_redirects
          cat > offline-site/_headers <<'HEADERS'
          /*
            Cache-Control: no-store, no-cache, must-revalidate
            X-Robots-Tag: noindex, nofollow
          HEADERS
          # Overwrite previously published HTML paths so Cloudflare
          # treats them as changed files and drops the old 7-day cache.
          while read -r rel; do
            [ -z "$rel" ] && continue
            mkdir -p "offline-site/$(dirname "$rel")"
            cp offline-site/index.html "offline-site/$rel"
          done <<'PATHS'
          404.html
          en.html
          ja.html
          zh-cn.html
          en/index.html
          ja/index.html
          zh-cn/index.html
          en/posts.html
          ja/posts.html
          zh-cn/posts.html
          en/posts/index.html
          ja/posts/index.html
          zh-cn/posts/index.html
          en/favorites/mottos.html
          ja/favorites/mottos.html
          zh-cn/favorites/mottos.html
          en/posts/edsac.html
          en/posts/emacs-line-number.html
          en/posts/ext-gcd.html
          en/posts/fp-lc100-001-permutation.html
          en/posts/gmp.html
          en/posts/godel.html
          en/posts/hindley-milner.html
          en/posts/lambda-the-origin.html
          en/posts/parametric-poly.html
          en/posts/qin-mss-bard.html
          ja/posts/edsac.html
          ja/posts/emacs-line-number.html
          ja/posts/fp-lc100-001-permutation.html
          ja/posts/gmp.html
          ja/posts/godel.html
          ja/posts/hindley-milner.html
          ja/posts/lambda-the-origin.html
          ja/posts/parametric-poly.html
          ja/posts/qin-mss-bard.html
          zh-cn/posts/edsac.html
          zh-cn/posts/emacs-line-number.html
          zh-cn/posts/ext-gcd.html
          zh-cn/posts/fp-lc100-001-permutation.html
          zh-cn/posts/gmp.html
          zh-cn/posts/godel.html
          zh-cn/posts/hindley-milner.html
          zh-cn/posts/lambda-the-origin.html
          zh-cn/posts/migrate.html
          zh-cn/posts/my-network-config.html
          zh-cn/posts/parametric-poly.html
          zh-cn/posts/qin-mss-bard.html
          PATHS

      - name: Publish offline page
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ayayaya-home
          directory: offline-site

      - name: Unbind ayayaya.org from Pages
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/ayayaya-home/domains/ayayaya.org" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" || true

      - name: Try purging Pages cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/ayayaya-home/purge_build_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" || true
          echo
