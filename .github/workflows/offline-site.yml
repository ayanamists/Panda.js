name: Take main site offline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/offline-site.yml"

concurrency:
  group: ayayaya-home-offline
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write offline site
        run: |
          mkdir -p offline-site
          cat > offline-site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex, nofollow">
            <title>ayayaya.org</title>
            <style>
              :root { color-scheme: dark light; }
              html, body { height: 100%; margin: 0; }
              body {
                display: grid;
                place-items: center;
                font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
                background: #f7f4ee;
                color: #2b2926;
              }
              @media (prefers-color-scheme: dark) {
                body { background: #161513; color: #e7e2d8; }
              }
              p { font-size: 1.05rem; letter-spacing: 0.04em; }
              small { display: block; margin-top: 0.6rem; opacity: 0.45; font-size: 0.85rem; }
            </style>
          </head>
          <body>
            <p>站点暂时下线。
              <small>This site is temporarily offline.</small>
            </p>
          </body>
          </html>
          HTML
          printf '%s\n' 'User-agent: *' 'Disallow: /' > offline-site/robots.txt
          printf '%s\n' '/*    /index.html   200' > offline-site/_redirects

      - name: Publish offline page
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ayayaya-home
          directory: offline-site

      - name: Unbind ayayaya.org from Pages
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/ayayaya-home/domains/ayayaya.org" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json"
