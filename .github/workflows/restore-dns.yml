name: Restore apex DNS

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-dns.yml"

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Create ayayaya.org CNAME
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone_id="034aaebc99b2820b8ce7877bbbd00d90"
          echo "GET zone"
          curl -sS "https://api.cloudflare.com/client/v4/zones/${zone_id}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json"
          echo
          echo "POST CNAME"
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"type":"CNAME","name":"ayayaya.org","content":"ayayaya-home.pages.dev","proxied":true,"ttl":1}'
          echo
